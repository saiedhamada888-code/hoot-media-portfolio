<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لوحة تحكم حوت الميديا</title>
<link rel="icon" href="logo.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet" />
<style>
  :root { --c1: #00d4ff; --c2: #ff2e93; --bg: #070d1f; --panel: #0d1630; --card: #121d3d; --line: #223056; --ink: #e8eefc; --muted: #8b98bd; --ok: #25d366; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Cairo", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden; display: grid; grid-template-columns: 460px 1fr; }
  ::selection { background: var(--c2); }
  /* ===== side ===== */
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .top { padding: 16px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .top img { width: 38px; }
  .top h1 { font-size: 17px; font-weight: 900; } .top small { color: var(--muted); font-size: 12px; display: block; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
  .tab { flex: none; border: 0; cursor: pointer; font: 700 13px "Cairo"; color: var(--muted); background: transparent; padding: 8px 12px; border-radius: 10px; white-space: nowrap; }
  .tab:hover { color: var(--ink); background: var(--card); }
  .tab.on { color: #fff; background: linear-gradient(120deg, var(--c1), var(--c2)); }
  .form { flex: 1; overflow-y: auto; padding: 18px; min-height: 0; }
  .form h2 { font-size: 18px; font-weight: 900; margin-bottom: 4px; } .form .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; line-height: 1.7; }
  .field { margin-bottom: 14px; } .field > label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 600 14px "Cairo", sans-serif; outline: 0; transition: border-color .2s, box-shadow .2s;
  }
  input:focus, textarea:focus { border-color: var(--c1); box-shadow: 0 0 0 3px rgba(0,212,255,.15); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.7; }
  .ltr { direction: ltr; text-align: left; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .color { display: flex; gap: 10px; align-items: center; } .color input[type=color] { width: 48px; height: 40px; border: 0; background: none; cursor: pointer; padding: 0; }
  .swatch { width: 100%; height: 22px; border-radius: 8px; margin-top: 6px; border: 1px solid var(--line); }
  .img { display: flex; gap: 10px; align-items: center; } .img img { width: 74px; height: 74px; object-fit: contain; background: #0a1226; border-radius: 12px; border: 1px solid var(--line); }
  .btn { border: 0; cursor: pointer; font: 800 13px "Cairo"; color: #fff; padding: 9px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); transition: transform .2s; }
  .btn:hover { transform: translateY(-1px); } .btn.pri { background: linear-gradient(120deg, var(--c1), var(--c2)); border: 0; }
  .btn.sm { padding: 5px 9px; font-size: 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .item .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 800; font-size: 13px; color: var(--c1); }
  .item .head span { display: flex; gap: 4px; }
  .item .field { margin-bottom: 9px; }
  .add { width: 100%; padding: 12px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); border-radius: 14px; cursor: pointer; font: 800 13px "Cairo"; } .add:hover { color: var(--ink); border-color: var(--c1); }
  .foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #0a1226; }
  .foot .st { margin-inline-start: auto; font-size: 12px; color: var(--ok); }
  /* ===== preview ===== */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #03060f; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .bar .sp { flex: 1; } .bar .btn.on { background: var(--c1); color: #001; }
  .stage { flex: 1; display: grid; place-items: center; padding: 14px; min-height: 0; }
  .stage iframe { width: 100%; height: 100%; border: 0; border-radius: 16px; background: #000; transition: width .4s; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .stage.mobile iframe { width: 390px; }
  .toast { position: fixed; bottom: 22px; left: 50%; translate: -50% 20px; background: #0d1630; border: 1px solid var(--c1); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: .3s; z-index: 9; max-width: 80vw; }
  .toast.show { opacity: 1; translate: -50% 0; }
  @media (max-width: 1000px) { body { grid-template-columns: 1fr; overflow: auto; height: auto; } aside { height: 100vh; } main { height: 90vh; } }
</style>
</head>
<body>
<aside>
  <div class="top"><img src="logo.svg" alt="" /><div><h1>لوحة تحكم حوت الميديا</h1><small>عدّل أي حاجة وشوفها قدامك على طول</small></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="form" id="form"></div>
  <div class="foot">
    <button class="btn pri" id="exportBtn">⬇️ تنزيل content.js للنشر</button>
    <button class="btn" id="importBtn">📂 استيراد</button>
    <button class="btn" id="resetBtn">↺ رجوع للأصل</button>
    <span class="st" id="st">اتحفظ ✓</span>
    <input type="file" id="importFile" accept=".js,.json" hidden />
  </div>
</aside>
<main>
  <div class="bar">
    <b style="font-size:13px">معاينة مباشرة</b>
    <button class="btn sm on" id="dDesk">🖥️ كمبيوتر</button>
    <button class="btn sm" id="dMob">📱 موبايل</button>
    <span class="sp"></span>
    <a class="btn sm" href="index.html" target="_blank" style="text-decoration:none">↗ افتح الموقع</a>
  </div>
  <div class="stage" id="stage"><iframe id="frame" src="index.html?admin=1" title="معاينة"></iframe></div>
</main>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="content.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const clone = (x) => JSON.parse(JSON.stringify(x));
const KEY = "hoot_overrides";

/* ===== الحالة: الافتراضي + content.js + اللي عدّلته قبل كده ===== */
let state = (() => { let local = null; try { local = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} return Object.assign(clone(DATA_DEFAULTS), clone(window.SITE_OVERRIDES || {}), local || {}); })();

const get = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
const set = (o, p, v) => { const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; };

/* ===== تعريف الأقسام ===== */
const TEXTS = [["cta", "زرار الهيرو"], ["toolsTitle", "عنوان كارت المنصات (HTML)"], ["projectsTitle", "عنوان فولدر أعمالنا"], ["projectsSub", "وصف فولدر أعمالنا"], ["projectsInside", "عنوان جوه فولدر أعمالنا"],
  ["clientsTab", "لسان فولدر العملاء"], ["clientsWord", "كلمة «عميل» جنب العدد"], ["clientsSub", "وصف فولدر العملاء"],
  ["whatQ1", "«هنعمل إيه؟»"], ["whatQ2", "«وإزاي؟»"], ["whyL1", "«ليه نضيّع» (سطر ١)"], ["whyL2", "«وقت» (سطر ٢)"],
  ["contactA", "عنوان الاتصال — الجزء الأول"], ["contactB", "عنوان الاتصال — الجزء الملوّن"], ["contactSub", "الجملة تحت العنوان"],
  ["fName", "حقل الاسم"], ["fMail", "حقل الإيميل"], ["fIdea", "حقل الفكرة"], ["fBtn", "زرار الإرسال"], ["fNote", "الملحوظة تحت الزرار"], ["footer", "نص الفوتر"]];

const arr2 = (toObj, fromObj) => ({ toObj, fromObj });
const SECTIONS = [
  { id: "general", title: "⚙️ عام", goto: "#top", hint: "الاسم والتواصل. استخدم «ـ» (تطويل) لمط الحروف في الاسم.", fields: [
    { k: "brandName", label: "اسم البراند (بيظهر في الجملة الكبيرة)" }, { k: "nameLine1", label: "الاسم — السطر الأول" }, { k: "nameLine2", label: "الاسم — السطر التاني" },
    { k: "whatsapp", label: "رقم الواتساب بالكود الدولي من غير + (اللي بتتفتح عليه الرسايل)", ltr: true }, { k: "email", label: "الإيميل", ltr: true },
    { k: "clients", type: "number", label: "عدد العملاء" }, { k: "featuredProject", label: "لسان فولدر أعمالنا" }] },
  { id: "look", title: "🎨 الألوان والصور", goto: "#hero", hint: "الصور بتتصغّر تلقائيًا. صورتك الأفضل PNG/WebP من غير خلفية.", fields: [
    { k: "colors.c1", type: "color", label: "اللون الأول" }, { k: "colors.c2", type: "color", label: "اللون التاني" },
    { k: "photo", type: "image", label: "صورتك", max: 1600, mime: "image/webp" }, { k: "whaleImg", type: "image", label: "صورة الحوت (PNG بخلفية شفافة — الحوت بيبص يمين)", max: 900, mime: "image/png" }] },
  { id: "texts", title: "✏️ النصوص", goto: "#top", hint: "كل النصوص الثابتة في الصفحة. بتقبل HTML بسيط.", fields: TEXTS.map(([k, label]) => ({ k: "texts." + k, label, type: "textarea", rows: 2 })) },
  { id: "statement", title: "💬 الجملة الكبيرة", goto: "#statement", hint: "كل كلمة (أو مجموعة كلمات) كارت. {brand} = اسم البراند، {logo} = شعار الحوت. الأيقونة اختيارية (حرف/رمز أو logo).",
    list: "statement", item: arr2((a) => ({ w: a[0] || "", ico: a[1] || "", col: a[2] || "" }), (o) => (o.ico ? [o.w, o.ico, o.col || "#111"] : [o.w])),
    fields: [{ k: "w", label: "الكلمة" }, { k: "ico", label: "أيقونة (اختياري)" }, { k: "col", label: "لون الأيقونة (CSS)", ltr: true }], blank: { w: "كلمة", ico: "", col: "" }, name: (o) => o.w },
  { id: "platforms", title: "📱 أيقونات المنصات", goto: "#top", hint: "slug = اسم الأيقونة من simple-icons (facebook, instagram, tiktok, whatsapp, snapchat, youtube, x, telegram...). cls: dark أو tt أو سيبه فاضي.",
    list: "platforms", fields: [{ k: "slug", label: "slug الأيقونة", ltr: true }, { k: "bg", label: "الخلفية (CSS gradient)", ltr: true, swatch: true }, { k: "cls", label: "cls (اختياري: dark / tt)", ltr: true }], blank: { slug: "telegram", bg: "linear-gradient(160deg,#42b4f0,#1c7bbf)", cls: "" }, name: (o) => o.slug },
  { id: "chips", title: "🏷️ تاجات المنصات", goto: "#top", hint: "الكلمات الصغيرة تحت أيقونات المنصات.", list: "chips", prim: true, blank: "منصة جديدة" },
  { id: "projects", title: "📁 أعمالنا", goto: "#projects", hint: "الكروت اللي بتظهر لما العميل يفتح فولدر أعمالنا. اللينك لو اتحط بيبقى الكارت قابل للضغط.",
    list: "projects", fields: [{ k: "name", label: "اسم الشغل" }, { k: "type", label: "النوع (مطعم، جيم...)" }, { k: "g", label: "ألوان الكارت (CSS gradient)", ltr: true, swatch: true }, { k: "link", label: "لينك (اختياري)", ltr: true }], blank: { name: "شغل جديد", type: "نوع", g: "linear-gradient(140deg,#00d4ff,#ff2e93)", link: "#" }, name: (o) => o.name },
  { id: "brands", title: "🤝 العملاء", goto: "#clients", hint: "البراندات اللي بتظهر لما يفتح فولدر العملاء.", list: "brands", prim: true, blank: "براند جديد" },
  { id: "team", title: "👥 الفريق", goto: "#team", hint: "كروت الأيقونات الـ3D.", list: "team", fields: [{ k: "icon", label: "الأيقونة (رمز/حرف)" }, { k: "title", label: "العنوان" }, { k: "text", label: "الوصف", type: "textarea" }, { k: "bg", label: "الخلفية (CSS gradient)", ltr: true, swatch: true }], blank: { icon: "★", title: "عنوان", text: "وصف", bg: "linear-gradient(160deg,#3ee6ff,#0058a3)" }, name: (o) => o.title },
  { id: "band", title: "🎞️ الشريط المتحرك", goto: "#team", hint: "الكلمات اللي بتجري في الشريط.", list: "band", prim: true, blank: "كلمة" },
  { id: "services", title: "🛠️ الخدمات", goto: "#services", hint: "قائمة الخدمات. التاجات بتتكتب مفصولة بفاصلة.",
    list: "services", item: arr2((a) => ({ name: a[0] || "", desc: a[1] || "", L: a[2] || "", tags: (a[3] || []).join(", ") }), (o) => [o.name, o.desc, o.L, o.tags.split(/[,،]/).map((x) => x.trim()).filter(Boolean)]),
    fields: [{ k: "name", label: "اسم الخدمة" }, { k: "desc", label: "وصف قصير", type: "textarea" }, { k: "L", label: "الحرف في المربع (حرف واحد)" }, { k: "tags", label: "تاجات (مفصولة بفاصلة)" }], blank: { name: "خدمة جديدة", desc: "وصف", L: "خ", tags: "Tag" }, name: (o) => o.name },
];

/* ===== الرسم ===== */
let cur = "general", gotoSel = "#top", persistT = 0, reloadT = 0;
const tabs = $("#tabs"), form = $("#form"), frame = $("#frame"), st = $("#st");
SECTIONS.forEach((s) => { const b = document.createElement("button"); b.className = "tab"; b.textContent = s.title; b.onclick = () => open(s.id); b.dataset.id = s.id; tabs.appendChild(b); });

function open(id) {
  cur = id; const sec = SECTIONS.find((s) => s.id === id);
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.id === id));
  gotoSel = sec.goto; render(); sendGoto();
}
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
const esc = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");

function fieldNode(f, obj, path, onChange) {
  const wrap = el(`<div class="field"><label>${f.label}</label></div>`);
  const v = path ? get(obj, path) : obj[f.k];
  const put = (val) => { if (path) set(obj, path, val); else obj[f.k] = val; onChange(); };
  let inp;
  if (f.type === "textarea") { inp = el(`<textarea rows="${f.rows || 3}">${esc(v)}</textarea>`); inp.oninput = () => put(inp.value); }
  else if (f.type === "color") { inp = el(`<div class="color"><input type="color" value="${esc(v)}"><input type="text" class="ltr" value="${esc(v)}"></div>`); const [c, t] = inp.querySelectorAll("input"); c.oninput = () => { t.value = c.value; put(c.value); }; t.oninput = () => { if (/^#[0-9a-f]{6}$/i.test(t.value)) c.value = t.value; put(t.value); }; }
  else if (f.type === "image") {
    inp = el(`<div class="img"><img src="${esc(v)}" alt=""><div style="flex:1"><input type="text" class="ltr" value="${f.k && String(v).startsWith("data:") ? "(صورة مرفوعة)" : esc(v)}" placeholder="اسم الملف أو لينك"><div style="margin-top:8px"><label class="btn sm" style="display:inline-block;cursor:pointer">⬆️ ارفع صورة<input type="file" accept="image/*" hidden></label></div></div></div>`);
    const [t, fl] = [inp.querySelector("input[type=text]"), inp.querySelector("input[type=file]")], im = inp.querySelector("img");
    t.onchange = () => { put(t.value); im.src = t.value; };
    fl.onchange = async () => { if (!fl.files[0]) return; try { const d = await fileToDataURL(fl.files[0], f.max, f.mime); put(d); im.src = d; t.value = "(صورة مرفوعة)"; } catch (e) { toast("الصورة مش اتقرت: " + e.message); } };
  }
  else { inp = el(`<input type="${f.type === "number" ? "number" : "text"}" class="${f.ltr ? "ltr" : ""}" value="${esc(v)}">`); inp.oninput = () => put(f.type === "number" ? +inp.value : inp.value); if (f.swatch) { const sw = el(`<div class="swatch" style="background:${esc(v)}"></div>`); inp.addEventListener("input", () => (sw.style.background = inp.value)); wrap.append(inp, sw); return wrap; } }
  wrap.appendChild(inp); return wrap;
}

function render() {
  const sec = SECTIONS.find((s) => s.id === cur);
  form.innerHTML = `<h2>${sec.title}</h2><p class="hint">${sec.hint || ""}</p>`;
  if (!sec.list) { sec.fields.forEach((f) => form.appendChild(fieldNode(f, state, f.k, persist))); return; }
  const arr = state[sec.list], A = sec.item;
  const model = () => (A ? arr.map(A.toObj) : sec.prim ? arr.map((v) => ({ v })) : arr);   // نموذج التحرير
  const objs = model();
  const sync = () => { state[sec.list] = A ? objs.map(A.fromObj) : sec.prim ? objs.map((o) => o.v) : objs; persist(); };
  const draw = () => {
    form.querySelectorAll(".item,.add").forEach((n) => n.remove());
    objs.forEach((o, i) => {
      const card = el(`<div class="item"><div class="head"><b>${i + 1}. ${esc(sec.prim ? o.v : sec.name(o))}</b><span><button class="btn sm" data-a="up">▲</button><button class="btn sm" data-a="dn">▼</button><button class="btn sm" data-a="del">🗑</button></span></div></div>`);
      const fields = sec.prim ? [{ k: "v", label: "النص" }] : sec.fields;
      fields.forEach((f) => card.appendChild(fieldNode(f, o, null, () => { sync(); card.querySelector(".head b").textContent = `${i + 1}. ${sec.prim ? o.v : sec.name(o)}`; })));
      card.querySelector('[data-a="up"]').onclick = () => { if (i) { [objs[i - 1], objs[i]] = [objs[i], objs[i - 1]]; sync(); draw(); } };
      card.querySelector('[data-a="dn"]').onclick = () => { if (i < objs.length - 1) { [objs[i + 1], objs[i]] = [objs[i], objs[i + 1]]; sync(); draw(); } };
      card.querySelector('[data-a="del"]').onclick = () => { objs.splice(i, 1); sync(); draw(); };
      form.appendChild(card);
    });
    const add = el(`<button class="add">＋ إضافة</button>`); add.onclick = () => { objs.push(sec.prim ? { v: sec.blank } : clone(sec.blank)); sync(); draw(); form.scrollTop = form.scrollHeight; };
    form.appendChild(add);
  };
  draw();
}

/* ===== الحفظ والمعاينة ===== */
function persist() {
  st.textContent = "بيتحفظ…"; st.style.color = "#f5c242";
  clearTimeout(persistT); persistT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); st.textContent = "اتحفظ ✓"; st.style.color = "var(--ok)"; }
    catch (e) { st.textContent = "المساحة مليانة ✗"; st.style.color = "#ff6b6b"; toast("الصور كبيرة على المتصفح — استخدم لينكات أو صور أصغر، أو نزّل content.js"); }
    clearTimeout(reloadT); reloadT = setTimeout(() => frame.contentWindow.location.reload(), 500);
  }, 350);
}
function sendGoto() { clearTimeout(sendGoto.t); sendGoto.t = setTimeout(() => frame.contentWindow.postMessage({ goto: gotoSel }, "*"), 400); }
frame.addEventListener("load", () => setTimeout(sendGoto, 1500));
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3800); }

/* ===== الصور: تصغير ورفع كـ data URL ===== */
function fileToDataURL(file, max, mime) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onerror = () => rej(new Error("قراءة")); r.onload = () => {
      const im = new Image(); im.onerror = () => rej(new Error("مش صورة")); im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL(mime, 0.9));
      }; im.src = r.result;
    }; r.readAsDataURL(file);
  });
}

/* ===== تصدير / استيراد / رجوع ===== */
$("#exportBtn").onclick = () => {
  const blob = new Blob([`/* اتصدّر من لوحة التحكم — حطه جنب index.html بنفس الاسم content.js */\nwindow.SITE_OVERRIDES = ${JSON.stringify(state)};\n`], { type: "text/javascript" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "content.js"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("نزل content.js — ارفعه جنب index.html على الاستضافة عشان التعديلات تظهر لكل الزوار");
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return; const t = await f.text();
  try { const j = t.trim().startsWith("{") ? JSON.parse(t) : JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1)); state = Object.assign(clone(DATA_DEFAULTS), j); persist(); render(); toast("اتستورد ✓"); } catch (err) { toast("الملف مش مظبوط"); }
};
$("#resetBtn").onclick = () => { if (confirm("ترجع كل حاجة للأصل؟ التعديلات المحفوظة هنا هتتمسح.")) { localStorage.removeItem(KEY); state = clone(DATA_DEFAULTS); persist(); render(); toast("رجع للأصل"); } };

/* ===== جهاز المعاينة ===== */
$("#dDesk").onclick = () => { $("#stage").classList.remove("mobile"); $("#dDesk").classList.add("on"); $("#dMob").classList.remove("on"); };
$("#dMob").onclick = () => { $("#stage").classList.add("mobile"); $("#dMob").classList.add("on"); $("#dDesk").classList.remove("on"); };

open("general");
</script>
</body>
</html>
